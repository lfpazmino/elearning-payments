<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payments Academy</title>
<meta name="description" content="A self-paced programme taking you from payment-flow fundamentals to defensible architectural depth — rails, economics, regulation, payment hub architecture, and agentic AI.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="topbar">
  <button class="iconbtn" id="menuBtn" type="button" aria-label="Toggle contents">☰</button>
  <a class="brand" id="homeLink" href="#/" style="text-decoration:none;color:inherit">
    <span class="mark">Payments Academy</span>
    <span class="sub">Sibos 2026 · Miami</span>
  </a>
  <span class="spacer"></span>
  <div class="gauge" title="Course progress">
    <span class="track"><span class="fill" id="gaugeFill"></span></span>
    <span class="pct" id="gaugePct">0%</span>
  </div>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="Cycle colour theme">AUTO</button>
</header>

<div class="scrim" id="scrim"></div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Course contents">
    <div id="railInner"></div>
  </nav>
  <main id="main"></main>
</div>

<script src="assets/js/course.js"></script>
<script src="assets/js/schema.js"></script>
<script src="assets/js/validate-load.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
